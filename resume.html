<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume | Gabriel R. Edwards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">Gabriel R. Edwards | AI & Cybersecurity Research</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/#about">About</a>
        <a href="/projects.html">Projects</a>
        <a href="/security.html">Security</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Resume</h1>
      <p>If the embedded viewer doesn't display, 
        <a href="/resume.pdf" class="link" target="_blank" rel="noopener">
          open the PDF in a new tab</a></p>

      <div class="resume-viewer" style="margin-top:16px">
        <!-- Primary: object embed -->
        <object data="/resume.pdf" type="application/pdf" width="100%" height="900"
                style="border:none;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);">
          <!-- Fallback: iframe -->
          <iframe src="/resume.pdf" width="100%" height="900"
                  style="border:none;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);"></iframe>
          <!-- Final fallback -->
          <p style="margin-top:12px">Your browser can’t display embedded PDFs. 
            <a href="/resume.pdf" class="link" target="_blank" rel="noopener">Open the resume in a new tab →</a>
          </p>
        </object>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Gabriel R. Edwards. All rights reserved.</small>
    </div>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </footer>
</body>
</html>
