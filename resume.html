<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume | Gabriel R. Edwards</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">Gabriel R. Edwards</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/#about">About</a>
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="resume-viewer" style="margin-top:16px">
  <!-- Use a cache-buster to avoid stale inline cache -->
  <embed src="/resume.pdf?v=1" type="application/pdf" width="100%" height="900"
         style="border:none;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);" />

  <!-- Fallbacks -->
  <object data="/resume.pdf?v=1" type="application/pdf" width="100%" height="900"
          style="border:none;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);">
    <iframe src="/resume.pdf?v=1#view=FitH" width="100%" height="900" style="border:none;"></iframe>
    <p style="margin-top:12px">
      Your browser can’t display embedded PDFs.
      <a href="/resume.pdf?v=1" class="link" target="_blank" rel="noopener">Open the resume in a new tab →</a>
    </p>
  </object>
</div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Gabriel R. Edwards. All rights reserved.</small>
    </div>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </footer>
</body>
</html>
